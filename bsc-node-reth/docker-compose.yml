services:
  reth:
    image: ${RETH_IMAGE:-ghcr.io/bnb-chain/bsc-reth:latest}
    container_name: bsc-node-reth
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./data/reth:/data
      - ./scripts/start.sh:/bsc/scripts/start.sh:ro
    entrypoint: ["/bin/bash", "/bsc/scripts/start.sh"]
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    mem_limit: ${MEM_LIMIT:-32g}
    memswap_limit: ${MEMSWAP_LIMIT:-48g}
    mem_reservation: ${MEM_RESERVATION:-16g}
